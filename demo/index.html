<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HomeView cards demo</title>
<style>
  html, body { margin: 0; background: #0c0f17; color: #fff; font-family: -apple-system, system-ui, sans-serif; }
  body { padding: 0; }
  #view { display: block; }
  .bar { position: fixed; z-index: 2000; right: 12px; bottom: 12px; display: flex; gap: 8px; }
  .bar button { font: inherit; padding: 8px 12px; border-radius: 999px; border: 0; cursor: pointer; }
</style>
<script>
  // Minimal stand-ins for the HA frontend elements the cards use.
  customElements.define('ha-card', class extends HTMLElement {});
  const ICONS = { 'mdi:': '' };
  customElements.define('ha-icon', class extends HTMLElement {
    static get observedAttributes() { return ['icon']; }
    set icon(v) { this._i = v; this.render(); } get icon() { return this._i; }
    attributeChangedCallback(_n, _o, v) { this.icon = v; }
    render() { this.style.cssText = 'display:inline-flex;width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px);border-radius:30%;background:currentColor;opacity:.85;flex:none'; this.title = this._i || ''; }
  });
  customElements.define('ha-state-icon', class extends HTMLElement {
    connectedCallback() { this.style.cssText = 'display:inline-flex;width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px);border-radius:50%;background:currentColor;opacity:.8;flex:none'; }
  });
</script>
</head>
<body>
<homeview-view id="view"></homeview-view>
<div class="bar"><button id="edit">Toggle edit</button><button id="night">Toggle night</button><button id="popup">Open lights pop-up</button><button id="notify">Fire notification</button></div>
<script type="module">
  // Cache-busted so a rebuild always shows up on reload.
  await import('../dist/homeview-cards.js?v=' + Date.now());

  const now = Date.now();
  const iso = (ms) => new Date(ms).toISOString();
  const st = (entity_id, state, attributes = {}) => ({ entity_id, state, attributes, last_changed: iso(now - 120000), last_updated: iso(now - 120000) });
  const states = {
    'light.living_ceiling': st('light.living_ceiling', 'on', { friendly_name: 'Ceiling', brightness: 166, color_mode: 'color_temp', color_temp_kelvin: 2900, supported_color_modes: ['color_temp', 'hs'] }),
    'light.living_lamp': st('light.living_lamp', 'on', { friendly_name: 'Floor lamp', brightness: 100, color_mode: 'hs', hs_color: [280, 70], rgb_color: [191, 90, 242], supported_color_modes: ['hs'] }),
    'light.kitchen': st('light.kitchen', 'on', { friendly_name: 'Kitchen', brightness: 255, color_mode: 'brightness', supported_color_modes: ['brightness'] }),
    'light.bedroom': st('light.bedroom', 'off', { friendly_name: 'Bedroom', supported_color_modes: ['brightness'] }),
    'scene.living_relax': st('scene.living_relax', '2026-10-27T18:00:00', { friendly_name: 'Relax' }),
    'scene.movie': st('scene.movie', '2026-10-27T18:00:00', { friendly_name: 'Movie' }),
    'scene.good_night': st('scene.good_night', '2026-10-27T18:00:00', { friendly_name: 'Good night' }),
    'climate.living': st('climate.living', 'heat', { friendly_name: 'Living Room', current_temperature: 20.4, temperature: 21, hvac_action: 'heating', current_humidity: 48, target_temp_step: 0.5, min_temp: 7, max_temp: 30 }),
    'weather.home': st('weather.home', 'rainy', { friendly_name: 'Home', temperature: 12 }),
    'sun.sun': st('sun.sun', 'above_horizon', { next_setting: iso(now + 2.3 * 3600e3), next_rising: iso(now + 15 * 3600e3) }),
    'weather.sunny': st('weather.sunny', 'partlycloudy', { friendly_name: 'Sunny', temperature: 13 }),
    'sensor.tv_power': st('sensor.tv_power', '95', { friendly_name: 'TV', unit_of_measurement: 'W', device_class: 'power' }),
    'sensor.dish_power': st('sensor.dish_power', '30', { friendly_name: 'Dishwasher', unit_of_measurement: 'W', device_class: 'power' }),
    'sensor.ev_power': st('sensor.ev_power', '0', { friendly_name: 'EV Charger', unit_of_measurement: 'W', device_class: 'power' }),
    'camera.driveway': st('camera.driveway', 'idle', { friendly_name: 'Driveway', entity_picture: '' }),
    'binary_sensor.driveway_person': st('binary_sensor.driveway_person', 'on', { friendly_name: 'Person' }),
    'media_player.living': st('media_player.living', 'playing', { friendly_name: 'Living Room', media_title: 'Low Light', media_artist: 'The Quiet Rooms', media_duration: 235, media_position: 151, media_position_updated_at: iso(now), volume_level: 0.4, supported_features: 1 | 4 | 8 | 16 | 32 | 16384 | 32768 | 262144, shuffle: false, repeat: 'off' }),
    'sensor.home_power': st('sensor.home_power', '1240', { friendly_name: 'Home power', unit_of_measurement: 'W', device_class: 'power' }),
    'sensor.flow': st('sensor.flow', '62', { unit_of_measurement: '°C' }),
    'sensor.return': st('sensor.return', '48', { unit_of_measurement: '°C' }),
    'binary_sensor.flame': st('binary_sensor.flame', 'on', {}),
    'sensor.bed_temp': st('sensor.bed_temp', '21.6', { device_class: 'temperature', unit_of_measurement: '°C' }),
    'sensor.bed_hum': st('sensor.bed_hum', '52', { device_class: 'humidity', unit_of_measurement: '%' }),
    'sensor.dishwasher': st('sensor.dishwasher', '62', { friendly_name: 'Dishwasher', unit_of_measurement: '%' }),
    'sensor.dishwasher_left': st('sensor.dishwasher_left', '1h 12m left', {}),
    'sensor.washer_progress': st('sensor.washer_progress', '82', { friendly_name: 'Washer progress', unit_of_measurement: '%' }),
    'sensor.washer_state': st('sensor.washer_state', 'finished', { friendly_name: 'Washer state' }),
    'vacuum.robot': st('vacuum.robot', 'cleaning', { friendly_name: 'Vacuum', fan_speed: 'turbo', fan_speed_list: ['quiet', 'balanced', 'turbo', 'max'], supported_features: 4 | 8 | 16 | 32 | 512 | 8192 | 16384 }),
    'sensor.robot_battery': st('sensor.robot_battery', '78', { device_class: 'battery', unit_of_measurement: '%' }),
    'calendar.family': st('calendar.family', 'off', { friendly_name: 'Family' }),
    'lock.front': st('lock.front', 'locked', { friendly_name: 'Front door' }),
    'person.fred': st('person.fred', 'home', { friendly_name: 'Fred', entity_picture: 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect width="40" height="40" fill="#8fb6ff"/><circle cx="20" cy="16" r="8" fill="#ffe0c2"/><rect x="8" y="27" width="24" height="14" rx="7" fill="#2b4a7a"/></svg>') }),
    'sensor.charger': st('sensor.charger', 'Unplugged', { friendly_name: 'Charger' }),
    'person.nic': st('person.nic', 'home', { friendly_name: 'Nic', entity_picture: 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect width="40" height="40" fill="#d9b8ff"/><circle cx="20" cy="16" r="8" fill="#f2c9a6"/><rect x="8" y="27" width="24" height="14" rx="7" fill="#7a3b8f"/></svg>') }),
    'calendar.bin_day': st('calendar.bin_day', 'on', { friendly_name: 'Bin day', message: 'Recycling bins', all_day: true }),
    'sensor.lights_on': st('sensor.lights_on', '16', { friendly_name: 'Lights On' }),
    'sensor.bins': st('sensor.bins', 'tomorrow', { friendly_name: 'Bins' }),
  };
  const entities = {
    'light.living_ceiling': { entity_id: 'light.living_ceiling', area_id: 'living' },
    'light.living_lamp': { entity_id: 'light.living_lamp', area_id: 'living' },
    'scene.living_relax': { entity_id: 'scene.living_relax', area_id: 'living' },
    'scene.movie': { entity_id: 'scene.movie', area_id: 'living' },
    'sensor.bed_temp': { entity_id: 'sensor.bed_temp', area_id: 'bedroom' },
    'sensor.bed_hum': { entity_id: 'sensor.bed_hum', area_id: 'bedroom' },
  };
  const series = (n, f) => Array.from({ length: n }, (_, i) => f(i));
  const hourly = series(8, (i) => ({ datetime: iso(now + i * 3600e3), condition: i < 2 ? 'rainy' : 'cloudy', temperature: 12 - i * 0.5, precipitation: i < 2 ? 0.6 - i * 0.3 : 0, precipitation_probability: i < 2 ? 80 - i * 25 : 10 }));
  const daily = [{ datetime: iso(now), condition: 'rainy', temperature: 14, templow: 8 }];
  const dry = series(8, (i) => ({ datetime: iso(now - (now % 3600e3) + i * 3600e3), condition: i < 3 ? 'partlycloudy' : 'clear-night', temperature: 12 - i, precipitation: 0, precipitation_probability: 0 }));

  const log = [];
  const hass = {
    states, entities, devices: {}, areas: { living: { area_id: 'living', name: 'Living Room' }, bedroom: { area_id: 'bedroom', name: 'Bedroom' }, kitchen: { area_id: 'kitchen', name: 'Kitchen' }, hall: { area_id: 'hall', name: 'Hall' } },
    config: { time_zone: 'Europe/London', unit_system: { temperature: '°C', length: 'km' } },
    themes: { darkMode: true, theme: 'default' }, language: 'en-GB', locale: { language: 'en-GB', time_format: '24' },
    user: { id: 'demo', name: 'Demo', is_admin: true },
    hassUrl: (p = '') => p,
    localize: (k) => k,
    formatEntityState: (s) => s.state + (s.attributes.unit_of_measurement && s.attributes.unit_of_measurement !== '%' ? ` ${s.attributes.unit_of_measurement}` : s.attributes.unit_of_measurement || ''),
    formatEntityAttributeValue: (s, a) => String(s.attributes[a]),
    callService: async (d, s, data, target, _n, ret) => {
      log.push([d, s, data, target]); console.log('service', d, s, data, target);
      if (d === 'calendar' && s === 'get_events') return { response: { [target.entity_id]: { events: [
        { start: new Date(now - 3600e3).toISOString(), end: new Date(now - 1800e3).toISOString(), summary: 'Design review' },
        { start: new Date(now + 2880e3).toISOString(), end: new Date(now + 6480e3).toISOString(), summary: 'Swimming', location: 'Leisure centre' },
        { start: new Date(now + 8000e3).toISOString(), end: new Date(now + 9000e3).toISOString(), summary: 'Bins out' } ] } } };
      return {};
    },
    callWS: async (msg) => {
      if (msg.type === 'energy/get_prefs') return {
        energy_sources: [{ type: 'grid', stat_energy_from: 'sensor.grid_in', stat_rate: 'sensor.home_power' }],
        device_consumption: [
          { stat_consumption: 'sensor.tv_energy', stat_rate: 'sensor.tv_power', name: 'TV' },
          { stat_consumption: 'sensor.dish_energy', stat_rate: 'sensor.dish_power', name: 'Dishwasher' },
          { stat_consumption: 'sensor.ev_energy', stat_rate: 'sensor.ev_power', name: 'EV Charger' },
        ],
      };
      if (msg.type === 'history/history_during_period' && msg.entity_ids.some((id) => id.includes('power'))) {
        // Step-like power, like a real meter: plateaus with sharp edges every few minutes.
        const start = Date.parse(msg.start_time), end = Date.parse(msg.end_time), out = {};
        for (const id of msg.entity_ids) {
          const rows = []; let t = start, k = 0;
          while (t < end) {
            const level = id === 'sensor.home_power' ? [180, 210, 650, 680, 1250, 1180, 240, 190][k % 8] + (k % 3) * 15 : id === 'sensor.tv_power' ? 95 : 30;
            rows.push({ s: String(level), lu: t / 1000 });
            t += (6 + (k * 7) % 17) * 60e3; k++;
          }
          out[id] = rows;
        }
        return out;
      }
      if (msg.type === 'history/history_during_period') {
        const out = {};
        for (const id of msg.entity_ids) {
          out[id] = series(40, (i) => ({ s: id.includes('power') ? String(400 + Math.abs(Math.sin(i / 3)) * 2500) : id.includes('flame') ? (i % 7 < 3 ? 'on' : 'off') : String(45 + Math.sin(i / 4) * 15), lu: (now - (40 - i) * 18 * 60e3) / 1000, a: { current_temperature: 19 + Math.sin(i / 5) * 1.5, temperature: i < 12 ? 18 : 21, hvac_action: i % 9 < 4 ? 'heating' : 'idle' } }));
        }
        return out;
      }
      if (msg.type === 'recorder/statistics_during_period') {
        const out = {};
        for (const id of msg.statistic_ids) out[id] = series(30, (i) => ({ start: now - (30 - i) * 300e3, end: now - (29 - i) * 300e3, mean: id.includes('temp') ? 21 + Math.sin(i / 6) : 50 + Math.cos(i / 5) * 5, change: id === 'sensor.ev_energy' ? (msg.units?.energy === 'kWh' ? 0.1 : 100) : 0.3 }));
        return out;
      }
      throw new Error('not in demo: ' + msg.type);
    },
    callApi: async () => ({}),
    connection: {
      subscribeMessage: async (cb, msg) => {
        if (msg.type === 'weather/subscribe_forecast') setTimeout(() => cb({ type: msg.forecast_type, forecast: msg.forecast_type === 'hourly' ? (msg.entity_id === 'weather.sunny' ? dry : hourly) : daily }), 50);
        return async () => {};
      },
    },
  };

  const cards = [
    { type: 'custom:homeview-clock-card', view_layout: { column: 1, row: 1, column_span: 2, row_span: 2 } },
    { type: 'custom:homeview-weather-card', entity: 'weather.home', view_layout: { column: 3, row: 1, column_span: 2, row_span: 2 } },
    { type: 'custom:homeview-thermostat-card', entity: 'climate.living', view_layout: { column: 5, row: 1, column_span: 2, row_span: 1 } },
    { type: 'custom:homeview-energy-card', view_layout: { column: 5, row: 2, column_span: 1, row_span: 1 } },
    { type: 'custom:homeview-comfort-card', area: 'bedroom', view_layout: { column: 6, row: 2, column_span: 1, row_span: 1 } },
    { type: 'custom:homeview-camera-card', entity: 'camera.driveway', view: 'snapshot', events: [{ entity: 'binary_sensor.driveway_person', label: 'Person', icon: 'mdi:account' }], view_layout: { column: 1, row: 3, column_span: 2, row_span: 2 } },
    { type: 'custom:homeview-media-card', entity: 'media_player.living', view_layout: { column: 3, row: 3, column_span: 2, row_span: 1 } },
    { type: 'custom:homeview-light-card', area: 'living', view_layout: { column: 5, row: 3 } },
    { type: 'custom:homeview-light-card', entity: 'light.kitchen', view_layout: { column: 6, row: 3 } },
    { type: 'custom:homeview-boiler-card', flow_temp_entity: 'sensor.flow', return_temp_entity: 'sensor.return', flame_entity: 'binary_sensor.flame', zones: [{ name: 'Radiators', climate_entity: 'climate.living' }], view_layout: { column: 3, row: 4 } },
    { type: 'custom:homeview-light-card', entity: 'light.bedroom', view_layout: { column: 4, row: 4 } },
    { type: 'custom:homeview-progress-card', entity: 'sensor.dishwasher', secondary_entities: ['sensor.dishwasher_left'], view_layout: { column: 5, row: 4, column_span: 2, row_span: 1 } },
    { type: 'custom:homeview-scene-card', entity: 'scene.movie', color: '#7D6BFF', note: 'Lights 10%, TV on', view_layout: { screen: 2 } },
    { type: 'custom:homeview-scene-card', entity: 'scene.good_night', color: '#5E5CE6', view_layout: { screen: 2 } },
    { type: 'custom:homeview-vacuum-card', entity: 'vacuum.robot', battery_entity: 'sensor.robot_battery', view_layout: { screen: 2, column_span: 2 } },
    { type: 'custom:homeview-energy-card', view_layout: { screen: 2, column_span: 2, row_span: 1 } },
    { type: 'custom:homeview-weather-card', entity: 'weather.sunny', forecast: 'hourly', view_layout: { screen: 2, column_span: 2, row_span: 2 } },
  ];

  const helpers = { createCardElement(cfg) { const el = document.createElement(cfg.type.replace('custom:', '')); el.setConfig(cfg); return el; } };
  window.loadCardHelpers = async () => helpers;

  // Stand-in for HA's hui-card wrapper, which carries the config the view reads.
  const inner = [];
  const els = cards.map((cfg) => {
    const card = helpers.createCardElement(cfg);
    inner.push(card);
    const wrap = document.createElement('div');
    wrap.style.height = '100%';
    wrap.config = cfg;
    wrap.getGridOptions = () => card.getGridOptions?.() ?? {};
    Object.defineProperty(wrap, 'hass', { set: (h) => (card.hass = h) });
    wrap.appendChild(card);
    card.hass = hass;
    return wrap;
  });

  const view = document.getElementById('view');
  view.setConfig({
    header: { greeting: true, chips: [
      { type: 'progress', entity: 'sensor.dishwasher', name: 'Dishwasher', icon: 'mdi:dishwasher', bar_color: 'blue', thresholds: [{ value: 0, color: 'blue' }, { value: 100, color: 'light-green' }], value_entity: 'sensor.dishwasher_left' },
      { type: 'progress', entity: 'sensor.washer_progress', name: 'Washer', icon: 'mdi:washing-machine', thresholds: [{ value: 100, color: 'light-green' }], pin_entity: 'sensor.washer_state', pin_states: ['finished'], pin_value: 'max' },
      { type: 'entity', entity: 'person.fred', show_name: true, show_state: true, show_entity_picture: true, visibility: [{ condition: 'state', entity: 'person.fred', state: 'home' }] },
      { type: 'entity', entity: 'person.nic', show_name: true, show_state: true, show_entity_picture: true, visibility: [{ condition: 'state', entity: 'person.nic', state: 'home' }] },
      { type: 'entity', entity: 'sensor.charger', show_name: false, show_state: true, show_icon: true, show_entity_picture: false, tap_action: { action: 'none' }, icon: 'mdi:ev-plug-type2', visibility: [{ condition: 'state', entity: 'sensor.charger', state_not: 'unavailable' }] },
      { type: 'entity', entity: 'calendar.bin_day', show_name: true, show_state: true, show_icon: true, state_content: 'message', show_entity_picture: false, visibility: [{ condition: 'state', entity: 'calendar.bin_day', state: 'on' }], tap_action: { action: 'none' } },
      { type: 'entity', entity: 'sensor.lights_on', show_name: false, show_state: true, show_icon: true, color: 'amber', state_content: ['state', 'name'], visibility: [{ condition: 'numeric_state', entity: 'sensor.lights_on', above: 0 }], tap_action: { action: 'navigate', navigation_path: '#lights-pop-up' } },
    ] },
    notifications: { style: 'fullscreen', notifications: [{ type: 'success', title: 'Washing finished', message: 'Time to hang it out.', entity: 'sensor.dishwasher', state: '100' }] },
  });
  view.hass = hass;
  view.cards = els;
  // Mock of HA's lovelace object: saving rewrites each card's config, as HA would.
  const rawConfig = { views: [{ type: 'custom:homeview-view', cards }] };
  const saves = [];
  const lovelace = (editMode) => ({
    editMode, config: rawConfig, rawConfig,
    saveConfig: async (raw) => {
      saves.push(raw);
      raw.views[0].cards.forEach((c, i) => { if (els[i]) els[i].config = c; });
      rawConfig.views = raw.views;
      view.lovelace = lovelace(view.lovelace.editMode);
      view.requestUpdate();
    },
  });
  view.path = [0];
  view.index = 0;
  view.lovelace = lovelace(false);
  window.saves = saves;
  view.addEventListener('ll-delete-card', (e) => { console.log('delete', e.detail); window.lastDelete = e.detail; });
  window.hass = hass; window.serviceLog = log;

  const refresh = () => {
    const next = { ...hass, states: { ...hass.states } };
    Object.assign(hass, next);
    view.hass = { ...hass };
    els.forEach((e) => (e.hass = view.hass));
  };
  document.getElementById('edit').onclick = () => (view.lovelace = lovelace(!view.lovelace.editMode));
  document.getElementById('night').onclick = () => {
    hass.states['input_boolean.night'] = st('input_boolean.night', hass.states['input_boolean.night']?.state === 'on' ? 'off' : 'on');
    view.setConfig({ ...view.config, night_entity: 'input_boolean.night', header: { greeting: true, chips: [] } });
    refresh();
  };
  document.getElementById('popup').onclick = () => inner[7].run('tap');
  document.getElementById('notify').onclick = () => { hass.states['sensor.dishwasher'] = st('sensor.dishwasher', '100', { friendly_name: 'Dishwasher', unit_of_measurement: '%' }); refresh(); };
</script>
</body>
</html>
