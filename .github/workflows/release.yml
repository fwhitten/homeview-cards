name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Keep the bundle's reported version in step with the tag being released.
      - name: Sync version with tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - run: npm run build

      # This version's section of CHANGELOG.md becomes the release notes, which
      # HACS shows in Home Assistant's update dialog.
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " { if (on) exit; on = ($2 == v) ; next }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md section for $version: add a '## $version' heading." >&2
            exit 1
          fi
          cat notes.md

      - name: Attach the bundle to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/homeview-cards.js
          body_path: notes.md
          generate_release_notes: true
